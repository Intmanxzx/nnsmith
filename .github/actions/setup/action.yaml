name: Setup on Linux
description: Setup basic conda and Python environment on Linux

inputs:
  mode:
    description: whether to install all dependencies
    required: true
    default: all

runs:
  using: composite
  steps:
    - name: install graphviz from apt
      run: |
        if command -v sudo >/dev/null 2>&1; then
          sudo apt-get update && sudo apt-get install -y graphviz graphviz-dev
        else
          apt-get update && apt-get install -y graphviz graphviz-dev
        fi
      shell: bash
    - name: set path to dependencies
      id: set-dep-path
      run: |
        if [ "${{ inputs.mode }}" = "all" ]; then
          echo "dep-path=requirements/**/*.txt" >> "$GITHUB_OUTPUT"
        elif [ "${{ inputs.mode }}" = "none" ]; then
          echo "dep-path=" >> "$GITHUB_OUTPUT"
        else
          echo "Wrong mode ${{ inputs.mode }}"
          exit 1
        fi
      shell: bash
    - name: set up Python with cache
      uses: actions/setup-python@v5
      id: py
      with:
        # ubuntu-latest now resolves to 26.04, which no longer provides 3.9.
        python-version: '3.11'
        # cache: 'pip'
        # cache-dependency-path: ${{ steps.set-dep-path.outputs.dep-path }}
    - run: echo "cache hit ${{ steps.py.outputs.cache-hit }}"
      shell: bash
    - name: install dependencies
      run: |
        if [ ${{ inputs.mode == 'all' }} ]; then
          pip install -r requirements/core.txt
          pip install -r requirements/dev.txt
        fi
        echo "PYTHONPATH=$PYTHONPATH:${GITHUB_WORKSPACE}" >> $GITHUB_ENV
      shell: bash

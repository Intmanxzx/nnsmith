name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          mode: all

      - name: Test core
        run: pytest -x -q tests/core

  # The torch/onnx/tvm/tensorrt/tensorflow suites from upstream are not run
  # here: they install PyTorch nightly plus GPU-oriented backends, which are
  # unstable on hosted runners. Run them locally when touching those backends.

[metadata]
# The distribution is published to PyPI as "autofusex-nnsmith": the name
# "nnsmith" belongs to the upstream project (ise-uiuc) and cannot be reused.
# The import name stays "nnsmith" so existing code is unaffected.
name = autofusex-nnsmith
version = 0.1.2.post1
description = "AutofuseX fork of NNSmith: automatic DNN generation for fuzzing and more."
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Intmanxzx/nnsmith
license = Apache-2.0
license_file = LICENSE
platform = any
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent
    Topic :: Software Development :: Testing

[options]
packages = find:
python_requires = >=3.8
dependency_links =
install_requires =
    z3-solver==4.12.2.0
    setuptools==75.8.0
    hydra-core>=1.2.0
    hydra-colorlog>=1.2.0
    multipledispatch>=0.6.0
    appdirs>=1.4.4
    numpy<2

# TODO: make it nightly.
[options.extras_require]
onnx = torch
       onnx
onnxruntime = onnxruntime
      torch
      onnx
tensorflow = tf-nightly
torch = torch
tvm = apache-tvm
      torch
      onnx

[options.package_data]
nnsmith = config/**/*.yaml

[options.entry_points]
console_scripts =
    nnsmith.model_gen = nnsmith.cli.model_gen:main
    nnsmith.model_exec = nnsmith.cli.model_exec:main
    nnsmith.dtype_test = nnsmith.cli.dtype_test:main
    nnsmith.fuzz = nnsmith.cli.fuzz:main
    nnsmith.report_syn = nnsmith.cli.report_syn:main
